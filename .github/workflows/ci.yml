name: 3S-CCR CI Pipeline

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Ruff linter
        run: ruff check .
      - name: Run CLI stage checks
        run: |
          python scripts/02_build_indexes.py
          python scripts/03_extract_signals.py
      - name: Run pytest suite (conformal guarantees + live API)
        run: pytest -v
